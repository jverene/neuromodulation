# E2 — hard regime (benchmark re-scoped to E1 failure regime, 2026-07-25).
# The original e2_closedloop.yaml used disc lesions that the baseline solved
# trivially (raw H 0.0023, metric saturates ~0.046). This config uses contiguous
# multi_block lesions exceeding the perception radius + event-weighted fitness
# so closed-loop modulation has a real gap to close. See NOTES.md.
#
# Calibrated: block_side=16, n_blocks=4, interval=150 -> neutral raw H 0.020,
# alive 0.051 (struggle zone). event_weighted fitness verified to de-saturate
# (3.2x slow-vs-fast repair) and death still loses to struggling (amendments 1+2).
run_name: e2_hard
seed: 0
target:
  emoji: "\U0001F98E"
  size: 40
  canvas: 96
model:
  channel_size: 16
  hidden_size: 128
  cell_dropout_rate: 0.5
  parent_params: results/20260724_123615_e0_channel_aware/params.pkl   # channel-aware parent (K=3)
  baseline_params: results/20260724_065141_e0_baseline/params.pkl       # E0 baseline (K=0)
rollout:
  T: 2000
  lesion_interval: 150        # tighter than original 250 -> less recovery time between hits
  tau_decision: 10
  K: 3
  grow_steps: 128
  traj_stride: 10
  gif_frame_every: 10
damage:                       # hard-regime: contiguous multi_block lesions > perception radius
  block_side: 16
  n_blocks: 4
evolve:
  population_size: 64
  std_init: 0.3
  num_generations: 300
  train_seeds: 8
  test_seeds: 8
  checkpoint_interval: 10
  log_interval: 5
  alive_floor: 0.0            # re-verified: death loses to struggling on new fitness+damage
  fitness: event_weighted     # exp recency kernel; de-saturates + rewards repair speed
  tau_w: 50.0                 # interval/3 = 150/3; half-life/tau_w = 0.40 (verified fine)
eval:
  num_condition_seeds: 5
  const_grid: [-1.0, -0.5, 0.0, 0.5, 1.0]
  gif_fps: 30
  survival_eps: 0.1
  half_life_window: 250
smoke:
  rollout:
    T: 200
    lesion_interval: 50
  evolve:
    population_size: 8
    num_generations: 3
    train_seeds: 2
    test_seeds: 2
    checkpoint_interval: 1000
    log_interval: 1
  eval:
    num_condition_seeds: 1
